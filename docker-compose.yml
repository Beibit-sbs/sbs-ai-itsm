services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbs_itsm}
      POSTGRES_USER: ${POSTGRES_USER:-sbs_itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbs_itsm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbs_itsm} -d ${POSTGRES_DB:-sbs_itsm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sbs_itsm:change_me_before_production@postgres:5432/sbs_itsm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      JOBS_EXECUTOR_MODE: ${JOBS_EXECUTOR_MODE:-redis}
      JOBS_QUEUE_NAME: ${JOBS_QUEUE_NAME:-jobs:queue}
      JOBS_DEAD_LETTER_QUEUE_NAME: ${JOBS_DEAD_LETTER_QUEUE_NAME:-jobs:dead-letter}
      JOBS_RETRY_BASE_SECONDS: ${JOBS_RETRY_BASE_SECONDS:-0.5}
      JOBS_RETRY_MAX_SECONDS: ${JOBS_RETRY_MAX_SECONDS:-15}
      EMAIL_ATTACHMENT_STORAGE_PATH: /var/lib/sbs-ai-itsm/email-attachments
    volumes:
      - email_attachment_data:/var/lib/sbs-ai-itsm/email-attachments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.jobs_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sbs_itsm:change_me_before_production@postgres:5432/sbs_itsm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_EXECUTOR_MODE: ${JOBS_EXECUTOR_MODE:-redis}
      JOBS_QUEUE_NAME: ${JOBS_QUEUE_NAME:-jobs:queue}
      JOBS_DEAD_LETTER_QUEUE_NAME: ${JOBS_DEAD_LETTER_QUEUE_NAME:-jobs:dead-letter}
      JOBS_RETRY_BASE_SECONDS: ${JOBS_RETRY_BASE_SECONDS:-0.5}
      JOBS_RETRY_MAX_SECONDS: ${JOBS_RETRY_MAX_SECONDS:-15}
      EMAIL_ATTACHMENT_STORAGE_PATH: /var/lib/sbs-ai-itsm/email-attachments
    volumes:
      - email_attachment_data:/var/lib/sbs-ai-itsm/email-attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:8080"
    environment:
      TLS_PROXY_CIDR: ${TLS_PROXY_CIDR:-127.0.0.1/32}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  email_attachment_data:
