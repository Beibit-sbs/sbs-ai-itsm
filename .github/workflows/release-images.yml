name: Immutable release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-backend
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-frontend
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Scan immutable backend image
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-backend@${{ steps.backend.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - name: Scan immutable frontend image
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-frontend@${{ steps.frontend.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable images with GitHub OIDC
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND_IMAGE"
          cosign sign --yes "$FRONTEND_IMAGE"
      - name: Attest backend image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Attest frontend image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sbs-ai-itsm-frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - name: Create immutable release manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          jq -n \
            --arg schema_version "2026.07.1" \
            --arg release_version "$RELEASE_VERSION" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg backend_image "ghcr.io/$REPOSITORY_OWNER/sbs-ai-itsm-backend@$BACKEND_DIGEST" \
            --arg frontend_image "ghcr.io/$REPOSITORY_OWNER/sbs-ai-itsm-frontend@$FRONTEND_DIGEST" \
            '{schema_version:$schema_version,release_version:$release_version,source_commit:$source_commit,backend_image:$backend_image,frontend_image:$frontend_image,mutable_tags:false}' \
            > release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.ref_name }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 365
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-manifest.json
