server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:5173; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;

  # Serve compiled static assets directly.
  location = /assets {
    try_files /index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    # Keep SPA routes working (including /assets page path) without nginx directory redirects.
    try_files $uri /index.html;
  }
}
