server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve compiled static assets directly.
  location = /assets {
    try_files /index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    # Keep SPA routes working (including /assets page path) without nginx directory redirects.
    try_files $uri /index.html;
  }
}
