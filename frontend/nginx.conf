limit_req_zone $binary_remote_addr zone=sbs_api_per_ip:10m rate=${API_RATE_LIMIT};
limit_req_zone $binary_remote_addr zone=sbs_login_per_ip:10m rate=${LOGIN_RATE_LIMIT};
limit_conn_zone $binary_remote_addr zone=sbs_connections_per_ip:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The template substitutes only TLS_PROXY_CIDR. This prevents clients from
  # spoofing audit IPs while preserving the address supplied by the TLS edge.
  set_real_ip_from ${TLS_PROXY_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; connect-src 'self' ws://$host wss://$host; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;

  # Keep credential attacks tightly bounded even though the authenticated API
  # allows office/NAT traffic and the declared peak acceptance profile.
  location = /api/v1/auth/login {
    limit_req zone=sbs_login_per_ip burst=${LOGIN_RATE_BURST} nodelay;
    limit_req_status 429;
    limit_conn sbs_connections_per_ip ${API_CONNECTION_LIMIT};
    limit_conn_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }

  location /api/ {
    limit_req zone=sbs_api_per_ip burst=${API_BURST} nodelay;
    limit_req_status 429;
    limit_conn sbs_connections_per_ip ${API_CONNECTION_LIMIT};
    limit_conn_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # Serve compiled static assets directly.
  location = /assets {
    expires -1;
    try_files /index.html =404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    # Keep SPA routes working (including /assets page path) without nginx directory redirects.
    try_files $uri /index.html;
  }
}
