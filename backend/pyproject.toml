[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbs-ai-itsm-backend"
version = "0.1.0"
description = "Backend foundation for SBS AI ITSM"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.41.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "openpyxl==3.1.5",
  "python-multipart==0.0.31",
  "apscheduler==3.10.4",
  "aiohttp==3.14.3",
  "boto3==1.34.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]
security = [
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/models/*.py" = ["F821"]
"app/services/*/__init__.py" = ["F401"]
"tests/*.py" = ["F841"]
