[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbs-ai-itsm-backend"
version = "0.1.0"
description = "Backend foundation for SBS AI ITSM"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.41.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "openpyxl==3.1.5",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
