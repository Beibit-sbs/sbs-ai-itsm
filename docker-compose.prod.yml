services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JOBS_EXECUTOR_MODE: ${JOBS_EXECUTOR_MODE:-redis}
      JOBS_QUEUE_NAME: ${JOBS_QUEUE_NAME:-jobs:queue}
      JOBS_DEAD_LETTER_QUEUE_NAME: ${JOBS_DEAD_LETTER_QUEUE_NAME:-jobs:dead-letter}
      JOBS_RETRY_BASE_SECONDS: ${JOBS_RETRY_BASE_SECONDS:-0.5}
      JOBS_RETRY_MAX_SECONDS: ${JOBS_RETRY_MAX_SECONDS:-15}
      APP_ENV: ${APP_ENV:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      RUN_STARTUP_DDL: ${RUN_STARTUP_DDL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.jobs_worker"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JOBS_EXECUTOR_MODE: ${JOBS_EXECUTOR_MODE:-redis}
      JOBS_QUEUE_NAME: ${JOBS_QUEUE_NAME:-jobs:queue}
      JOBS_DEAD_LETTER_QUEUE_NAME: ${JOBS_DEAD_LETTER_QUEUE_NAME:-jobs:dead-letter}
      JOBS_RETRY_BASE_SECONDS: ${JOBS_RETRY_BASE_SECONDS:-0.5}
      JOBS_RETRY_MAX_SECONDS: ${JOBS_RETRY_MAX_SECONDS:-15}
      APP_ENV: ${APP_ENV:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      RUN_STARTUP_DDL: ${RUN_STARTUP_DDL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
