global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: sbs-ai-itsm

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sbs-backend
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_auth_token
    dns_sd_configs:
      - names:
          - backend
        type: A
        port: 8000
        refresh_interval: 15s
